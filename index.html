<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>오늘의 ETF — TIME 액티브 레이더</title>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Markdown Parser for Gemini Pro Modal -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; background-color: #f8fafc; color: #1e293b; }
    .prose-custom { color: #334155; font-size: 0.875rem; line-height: 1.6; }
    .prose-custom h3 { color: #0f172a; font-weight: 700; margin-top: 1rem; margin-bottom: 0.25rem; }
    .prose-custom ul { list-style-type: disc; padding-left: 1.25rem; margin: 0.5rem 0; }
  </style>
</head>
<body class="min-h-screen pb-20 bg-[#f8fafc]">

  <!-- 1. 앱 스타일 최상단 헤더 -->
  <header class="sticky top-0 z-40 bg-white border-b border-slate-200">
    <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button class="text-slate-700 p-1"><i data-lucide="menu" class="w-5 h-5"></i></button>
        <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-indigo-500 via-blue-500 to-teal-400 p-[1.5px] flex items-center justify-center">
          <div class="w-full h-full bg-white rounded-full flex items-center justify-center">
            <div class="w-3.5 h-3.5 rounded-full bg-blue-600"></div>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button class="text-slate-700 p-1"><i data-lucide="search" class="w-5 h-5"></i></button>
        <button onclick="openApiKeyModal()" class="text-slate-700 p-1 relative">
          <i data-lucide="key" class="w-5 h-5 text-amber-500"></i>
        </button>
        <button onclick="loadRadarData()" class="text-slate-700 p-1">
          <i data-lucide="refresh-cw" class="w-5 h-5 text-slate-500"></i>
        </button>
        <div class="w-7 h-7 rounded-full bg-indigo-600 text-white flex items-center justify-center text-xs font-bold">
          뿌리
        </div>
      </div>
    </div>

    <!-- 국가 토글 & 시황 티커 바 -->
    <div class="max-w-md mx-auto px-4 py-2 flex items-center justify-between border-t border-slate-100 text-xs bg-white">
      <div class="flex items-center bg-slate-100 p-0.5 rounded-full border border-slate-200">
        <button onclick="setCountry('KR')" id="tab-KR" class="px-2.5 py-1 rounded-full bg-white shadow-sm font-bold flex items-center gap-1 text-slate-800">
          <span>🇰🇷</span>
        </button>
        <button onclick="setCountry('US')" id="tab-US" class="px-2.5 py-1 rounded-full text-slate-400 font-medium flex items-center gap-1">
          <span>🇺🇸</span>
        </button>
      </div>
      <div class="text-[11px] text-slate-500 flex items-center gap-2">
        <span>TIME 14종 전수</span>
        <span class="text-slate-300">|</span>
        <span id="lastUpdated" class="text-blue-600 font-medium">동기화 중...</span>
      </div>
    </div>

    <!-- 네비게이션 탭 -->
    <div class="max-w-md mx-auto px-4 flex gap-6 text-sm font-semibold border-t border-slate-100 overflow-x-auto scrollbar-none bg-white">
      <button class="py-3 text-slate-900 border-b-2 border-slate-900 font-bold whitespace-nowrap">오늘의 TIME ETF</button>
      <button onclick="setFilter('super')" class="py-3 text-slate-400 hover:text-slate-600 whitespace-nowrap">🔥 슈퍼압축픽</button>
      <button onclick="setFilter('single')" class="py-3 text-slate-400 hover:text-slate-600 whitespace-nowrap">지수형 승부주</button>
    </div>
  </header>

  <!-- 2. 메인 컨텐츠 영역 -->
  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">

    <!-- 섹션 타이틀 -->
    <div class="flex items-center justify-between">
      <h2 class="text-base font-bold text-slate-900 flex items-center gap-1.5">
        TIME ETF가 새로 편입한 종목
        <span class="text-slate-400 cursor-pointer text-xs" title="타임폴리오 14종 액티브 ETF의 최근 편입 및 집중 매집 종목입니다.">ⓘ</span>
      </h2>
      <span class="text-xs text-slate-500 font-medium" id="itemCount">0개 포착</span>
    </div>

    <!-- 종목 랭킹 리스트 컨테이너 -->
    <div id="stockList" class="space-y-3">
      <!-- 동적 렌더링 -->
      <div class="bg-white rounded-2xl p-8 text-center text-slate-400 text-xs border border-slate-200">
        데이터를 불러오는 중입니다...
      </div>
    </div>

  </main>

  <!-- 3. Gemini Pro 심층 리서치 모달 (팝업창) -->
  <div id="proModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg max-h-[85vh] rounded-3xl flex flex-col overflow-hidden shadow-2xl border border-slate-200">
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
        <div>
          <span class="text-[10px] px-2 py-0.5 rounded bg-indigo-50 text-indigo-600 font-bold border border-indigo-200">GEMINI PRO RESEARCH</span>
          <h2 id="modalStockName" class="text-base font-bold text-slate-900 mt-1">종목명</h2>
        </div>
        <button onclick="closeProModal()" class="p-1.5 rounded-full hover:bg-slate-200 text-slate-400">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div id="modalContent" class="p-5 overflow-y-auto space-y-4 prose-custom"></div>
    </div>
  </div>

  <!-- API Key 설정 모달 -->
  <div id="apiKeyModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-3 shadow-2xl border border-slate-200">
      <h3 class="text-sm font-bold text-slate-900 flex items-center gap-1.5">
        <i data-lucide="key" class="w-4 h-4 text-amber-500"></i> Gemini API Key 설정
      </h3>
      <p class="text-xs text-slate-500 leading-relaxed">
        Google AI Studio에서 발급받은 무료 API Key를 입력하시면 개인 브라우저에 안전하게 저장됩니다.
      </p>
      <input type="password" id="userApiKeyInput" placeholder="AIzaSy..." class="w-full px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-900 focus:outline-none focus:border-blue-500" />
      <div class="flex justify-end gap-2 pt-1">
        <button onclick="closeApiKeyModal()" class="px-3 py-1.5 rounded-lg text-xs text-slate-500">취소</button>
        <button onclick="saveApiKey()" class="px-3 py-1.5 rounded-lg bg-blue-600 text-xs font-bold text-white shadow-sm">저장</button>
      </div>
    </div>
  </div>

  <script>
    let allStocks = [];
    let currentCountry = 'KR'; // 'KR' or 'US'
    let currentFilter = 'all';

    // 한국 주식 여부 판별 (한글 포함 여부 및 종목코드 규칙)
    function isKoreanStock(name) {
      return /[ㄱ-ㅎ|ㅏ-ㅣ|가-힣]/.test(name);
    }

    async function loadRadarData() {
      const updatedEl = document.getElementById('lastUpdated');
      try {
        const res = await fetch(`data.json?v=${new Date().getTime()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error("로드 실패");
        const data = await res.json();

        updatedEl.textContent = data.last_updated || '오늘 기준';
        allStocks = data.stocks || [];
        renderList();
      } catch (err) {
        console.error(err);
      }
    }

    function setCountry(country) {
      currentCountry = country;
      if (country === 'KR') {
        document.getElementById('tab-KR').className = "px-2.5 py-1 rounded-full bg-white shadow-sm font-bold flex items-center gap-1 text-slate-800";
        document.getElementById('tab-US').className = "px-2.5 py-1 rounded-full text-slate-400 font-medium flex items-center gap-1";
      } else {
        document.getElementById('tab-US').className = "px-2.5 py-1 rounded-full bg-white shadow-sm font-bold flex items-center gap-1 text-slate-800";
        document.getElementById('tab-KR').className = "px-2.5 py-1 rounded-full text-slate-400 font-medium flex items-center gap-1";
      }
      renderList();
    }

    function setFilter(filter) {
      currentFilter = currentFilter === filter ? 'all' : filter;
      renderList();
    }

    function renderList() {
      const container = document.getElementById('stockList');
      const countEl = document.getElementById('itemCount');

      // 1. 국가 필터링
      let filtered = allStocks.filter(s => {
        const isKr = isKoreanStock(s.name);
        return currentCountry === 'KR' ? isKr : !isKr;
      });

      // 2. 전략 필터링
      if (currentFilter === 'super') {
        filtered = filtered.filter(s => (s.etfs && s.etfs.length >= 2));
      } else if (currentFilter === 'single') {
        filtered = filtered.filter(s => s.is_single_conviction);
      }

      countEl.textContent = `${filtered.length}개 포착`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-10 text-center text-slate-400 text-xs border border-slate-200">
            해당 조건의 편입 종목이 없습니다.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map((s, index) => {
        const rank = index + 1;
        const etfList = s.etfs || [];
        const etfCount = etfList.length;
        const isTop = rank === 1;

        // ETF 편입 비중 칩 목록 생성
        const etfBadges = etfList.map(etfName => `
          <div class="inline-flex items-center px-2 py-1 rounded-md bg-slate-50 border border-slate-200 text-[11px] text-slate-600 font-medium">
            ${etfName.replace('TIME ', '')} <span class="ml-1 text-slate-900 font-bold">${s.current}</span>
          </div>
        `).join('');

        const safeStr = encodeURIComponent(JSON.stringify(s));

        // 뚝이지 스타일: 1위는 연한 에메랄드 테두리 카드, 2위 이하는 깔끔한 화이트 카드
        if (isTop) {
          return `
            <div class="bg-white rounded-2xl p-4 border-2 border-emerald-300/80 shadow-sm space-y-3 transition">
              <div class="flex items-center justify-between">
                <span class="inline-flex items-center gap-1 text-[11px] font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200">
                  ${currentCountry === 'KR' ? '🇰🇷 국내' : '🇺🇸 해외'} 1위
                </span>
                <span class="text-sm font-black text-emerald-600">
                  ${etfCount} <span class="text-xs font-semibold text-slate-400">ETF</span>
                </span>
              </div>

              <div>
                <div class="flex items-baseline gap-1.5">
                  <h3 class="text-base font-black text-slate-900 tracking-tight">${s.name}</h3>
                  <span class="text-[11px] text-slate-400 font-medium">000000</span>
                </div>
                <div class="flex flex-wrap gap-1.5 mt-2.5">
                  ${etfBadges}
                </div>
              </div>

              <!-- 텔레그램 인과관계 요약 -->
              <div class="bg-slate-50 rounded-xl p-2.5 text-[11px] text-slate-600 border border-slate-100 flex items-start gap-1.5">
                <span class="text-blue-600 font-bold shrink-0">💡 운용역 포커스:</span>
                <span class="line-clamp-2">${s.reason || s.logic_chain || '복수 펀드 집중 매집 대장주'}</span>
              </div>

              <!-- Pro 심층 리서치 버튼 -->
              <button onclick="requestProDeepDive('${safeStr}')" class="w-full py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-[11px] font-bold flex items-center justify-center gap-1 transition">
                <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-400"></i>
                Gemini Pro 심층 리포트 보기
              </button>
            </div>
          `;
        }

        // 2위 이하 일반 카드
        return `
          <div class="bg-white rounded-2xl p-4 border border-slate-200/90 shadow-sm space-y-2.5 transition">
            <div class="flex items-center justify-between">
              <div class="flex items-baseline gap-2">
                <span class="text-xs font-bold text-slate-400 w-3">${rank}</span>
                <h3 class="text-sm font-bold text-slate-900 tracking-tight">${s.name}</h3>
                <span class="text-[10px] text-slate-400 font-medium">000000</span>
              </div>
              <span class="text-xs font-black text-slate-800">
                ${etfCount} <span class="text-[11px] font-medium text-slate-400">ETF</span>
              </span>
            </div>

            <div class="flex flex-wrap gap-1.5 pl-5">
              ${etfBadges}
            </div>

            <div class="pl-5 pt-1">
              <button onclick="requestProDeepDive('${safeStr}')" class="text-[11px] text-indigo-600 font-bold hover:underline flex items-center gap-1">
                <i data-lucide="sparkles" class="w-3 h-3 text-indigo-500"></i> 운용역 매수 가설 & 리포트 보기
              </button>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // Gemini Pro 리서치 호출 함수
    async function requestProDeepDive(encodedStock) {
      const stock = JSON.parse(decodeURIComponent(encodedStock));
      const modal = document.getElementById('proModal');
      const titleEl = document.getElementById('modalStockName');
      const contentEl = document.getElementById('modalContent');

      titleEl.textContent = `${stock.name} — 타임폴리오 펀드 심층 분석`;
      modal.classList.remove('hidden');

      contentEl.innerHTML = `
        <div class="py-12 flex flex-col items-center justify-center text-center space-y-2">
          <div class="w-7 h-7 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
          <div class="text-xs text-indigo-600 font-bold">Gemini Pro가 심층 리포트를 작성 중입니다...</div>
          <p class="text-[11px] text-slate-400">공식 텔레그램 및 14개 ETF 포트폴리오 교차 연산 중</p>
        </div>
      `;

      const apiKey = localStorage.getItem('gemini_api_key') || "";
      if (!apiKey) {
        contentEl.innerHTML = `
          <div class="p-6 text-center space-y-3">
            <h4 class="text-sm font-bold text-slate-900">Gemini API Key가 필요합니다</h4>
            <p class="text-xs text-slate-500">우측 상단 열쇠(🔑) 버튼을 눌러 API Key를 등록해 주세요.</p>
            <button onclick="closeProModal(); openApiKeyModal();" class="px-4 py-2 rounded-xl bg-blue-600 text-xs font-bold text-white">등록하러 가기</button>
          </div>
        `;
        return;
      }

      const prompt = `
당신은 타임폴리오자산운용의 수석 리서치 애널리스트입니다.
아래 종목에 대해 투자자가 '왜 타임폴리오 ETF들이 이 종목을 담았는지'를 납득할 수 있는 심층 리서치 메모를 마크다운 형식으로 작성해 주십시오.

[종목 정보]:
- 종목명: ${stock.name}
- 편입된 TIME ETF: ${(stock.etfs || []).join(', ')}
- 편입 비중: ${stock.current}
- 텔레그램 연계 단서: ${stock.trigger || stock.reason || ''}

다음 목차로 냉철하고 실전적으로 작성해 주십시오:
1. ### 1. 운용역이 주목한 핵심 산업/기술 모멘텀
2. ### 2. 기업의 독점력과 실적 레버리지 (Moat)
3. ### 3. TIME ETF 복수 편입의 의미 및 투자 행동 지침
      `;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-pro:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await res.json();
        const reportMd = data.candidates[0].content.parts[0].text;
        contentEl.innerHTML = marked.parse(reportMd);
      } catch (err) {
        contentEl.innerHTML = `<div class="p-4 text-center text-xs text-rose-500">보고서 생성 실패: ${err.message}</div>`;
      }
    }

    function closeProModal() { document.getElementById('proModal').classList.add('hidden'); }
    function openApiKeyModal() {
      document.getElementById('userApiKeyInput').value = localStorage.getItem('gemini_api_key') || "";
      document.getElementById('apiKeyModal').classList.remove('hidden');
    }
    function closeApiKeyModal() { document.getElementById('apiKeyModal').classList.add('hidden'); }
    function saveApiKey() {
      const val = document.getElementById('userApiKeyInput').value.trim();
      if (val) localStorage.setItem('gemini_api_key', val);
      else localStorage.removeItem('gemini_api_key');
      closeApiKeyModal();
      alert('저장되었습니다.');
    }

    window.addEventListener('DOMContentLoaded', loadRadarData);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') loadRadarData();
    });
  </script>
</body>
</html>
