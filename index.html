<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>타임폴리오 액티브 ETF 레이더 (14종 전수)</title>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #0b0f19; color: #f1f5f9; }
    .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-header { background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(16px); }
  </style>
</head>
<body class="min-h-screen pb-16">

  <!-- 상단 네비게이션 헤더 -->
  <header class="sticky top-0 z-50 glass-header border-b border-slate-800/80 px-4 py-3.5">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-black text-white text-xs shadow-lg shadow-blue-500/20">
          TF
        </div>
        <div>
          <h1 class="text-sm font-bold tracking-tight text-white flex items-center gap-1.5">
            타임폴리오 액티브 레이더
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-blue-500/10 text-blue-400 font-semibold border border-blue-500/20">14종 전수</span>
          </h1>
          <p id="lastUpdated" class="text-[11px] text-slate-400">데이터 로딩 중...</p>
        </div>
      </div>
      <button onclick="loadRadarData()" class="p-2 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition active:scale-95">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-4 space-y-4">

    <!-- 감시 현황 요약 카드 -->
    <div class="glass-card rounded-2xl p-4 flex items-center justify-between">
      <div>
        <div class="text-[11px] font-medium text-slate-400">실시간 추적 ETF 포트폴리오</div>
        <div class="text-lg font-black text-white mt-0.5 flex items-center gap-2">
          <span id="trackedCount" class="text-blue-400">14</span>개 ETF 전 라인업
        </div>
      </div>
      <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        실시간 PDF 동기화 완료
      </div>
    </div>

    <!-- 필터 탭 -->
    <div class="flex space-x-2 overflow-x-auto pb-1 text-xs font-semibold scrollbar-none">
      <button onclick="setFilter('all')" id="btn-all" class="filter-btn px-3 py-2 rounded-xl bg-blue-600 text-white shadow-md shadow-blue-600/30 whitespace-nowrap">전체 보기</button>
      <button onclick="setFilter('super')" id="btn-super" class="filter-btn px-3 py-2 rounded-xl bg-slate-800 text-slate-400 hover:text-white whitespace-nowrap">🔥 슈퍼 압축픽 (3개+)</button>
      <button onclick="setFilter('house')" id="btn-house" class="filter-btn px-3 py-2 rounded-xl bg-slate-800 text-slate-400 hover:text-white whitespace-nowrap">하우스 압축픽 (2개)</button>
      <button onclick="setFilter('single')" id="btn-single" class="filter-btn px-3 py-2 rounded-xl bg-slate-800 text-slate-400 hover:text-white whitespace-nowrap">지수형 단독 승부주</button>
    </div>

    <!-- 종목 카드 리스트 컨테이너 -->
    <div id="stockList" class="space-y-3">
      <!-- 자바스크립트로 렌더링 -->
      <div class="text-center py-16 text-slate-500 text-sm">
        장부 데이터를 불러오는 중입니다...
      </div>
    </div>

  </main>

  <script>
    let allStocks = [];
    let currentFilter = 'all';

    async function loadRadarData() {
      const listEl = document.getElementById('stockList');
      const updatedEl = document.getElementById('lastUpdated');
      const countEl = document.getElementById('trackedCount');

      try {
        // 캐시 방지 파라미터 추가
        const res = await fetch('data.json?t=' + new Date().getTime());
        if (!res.ok) throw new Error("네트워크 응답 오류");
        const data = await res.json();

        updatedEl.textContent = data.last_updated || '최신 업데이트 완료';
        countEl.textContent = data.total_etfs_tracked || (data.tracked_etfs ? data.tracked_etfs.length : 14);
        allStocks = data.stocks || [];

        renderStocks();
      } catch (err) {
        console.error(err);
        listEl.innerHTML = `
          <div class="glass-card rounded-2xl p-8 text-center text-rose-400 text-sm">
            데이터를 불러오지 못했습니다.<br>잠시 후 다시 시도해 주세요.
          </div>
        `;
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white', 'shadow-md', 'shadow-blue-600/30');
        btn.classList.add('bg-slate-800', 'text-slate-400');
      });
      const activeBtn = document.getElementById(`btn-${filter}`);
      if (activeBtn) {
        activeBtn.classList.remove('bg-slate-800', 'text-slate-400');
        activeBtn.classList.add('bg-blue-600', 'text-white', 'shadow-md', 'shadow-blue-600/30');
      }
      renderStocks();
    }

    function renderStocks() {
      const listEl = document.getElementById('stockList');
      if (!allStocks || allStocks.length === 0) {
        listEl.innerHTML = `<div class="glass-card rounded-2xl p-8 text-center text-slate-500 text-sm">등록된 종목 데이터가 없습니다.</div>`;
        return;
      }

      let filtered = allStocks.filter(s => {
        const count = s.etfs ? s.etfs.length : 1;
        if (currentFilter === 'super') return count >= 3;
        if (currentFilter === 'house') return count === 2;
        if (currentFilter === 'single') return s.is_single_conviction;
        return true;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="glass-card rounded-2xl p-8 text-center text-slate-500 text-sm">해당 조건에 일치하는 종목이 없습니다.</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(s => {
        const etfCount = s.etfs ? s.etfs.length : 1;
        const etfBadges = (s.etfs || []).map(e => `
          <span class="text-[10px] px-2 py-0.5 rounded-md bg-slate-800 text-slate-300 border border-slate-700/60 font-medium">
            ${e.replace('TIME ', '')}
          </span>
        `).join('');

        let badgeColor = "bg-blue-500/10 text-blue-400 border-blue-500/20";
        if (etfCount >= 3) badgeColor = "bg-rose-500/10 text-rose-400 border-rose-500/20";
        else if (etfCount === 2) badgeColor = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
        else if (s.is_single_conviction) badgeColor = "bg-purple-500/10 text-purple-400 border-purple-500/20";

        return `
          <div class="glass-card rounded-2xl p-4.5 space-y-3 transition hover:border-slate-700">
            <div class="flex items-start justify-between">
              <div>
                <div class="flex items-center gap-2">
                  <h3 class="text-base font-bold text-white tracking-tight">${s.name}</h3>
                  <span class="text-[11px] px-2 py-0.5 rounded-full border font-semibold ${badgeColor}">
                    ${s.strategyLabel || (etfCount + '개 펀드 편입')}
                  </span>
                </div>
                <div class="flex flex-wrap gap-1.5 mt-2">
                  ${etfBadges}
                </div>
              </div>
              <div class="text-right">
                <div class="text-xs font-bold text-emerald-400">${s.actionGuide || '비중 확대'}</div>
                <div class="text-[11px] text-slate-400 mt-0.5">편입비중: <b class="text-slate-200 font-semibold">${s.current}</b></div>
              </div>
            </div>

            <!-- AI 투자 가설 및 근거 -->
            <div class="bg-slate-900/60 rounded-xl p-3 border border-slate-800/80 space-y-1.5">
              <div class="text-[11px] font-bold text-slate-300 flex items-center gap-1.5">
                <i data-lucide="sparkles" class="w-3.5 h-3.5 text-blue-400"></i> 운용역 매수 가설 (Thesis)
              </div>
              <p class="text-xs text-slate-400 leading-relaxed font-normal">${s.reason || '타임폴리오 복수 펀드 집중 편입 종목'}</p>
              ${s.metric ? `<div class="text-[11px] text-slate-500 pt-1 border-t border-slate-800/60 whitespace-pre-line">${s.metric}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // 초기 실행
    window.addEventListener('DOMContentLoaded', () => {
      loadRadarData();
    });
  </script>
</body>
</html>
