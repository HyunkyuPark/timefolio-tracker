name: Daily Auto ETF Position Tracker

on:
  schedule:
    # 한국시간(KST) 매일 17:30 (평일 월-금 장 마감 후) 실행 (UTC 기준 08:30)
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # Actions 탭에서 [Run workflow] 버튼으로 즉시 수동 실행 허용

permissions:
  contents: write # data.json 파일을 저장소에 커밋/푸시할 수 있는 쓰기 권한 부여

jobs:
  run-updater:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run ETF Tracker Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python updater.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data.json history.json || true
          git commit -m "Auto update ETF positions [skip ci]" || echo "No changes to commit"
          git push origin main

