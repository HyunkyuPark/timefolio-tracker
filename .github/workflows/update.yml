name: Update Timefolio ETF Radar

on:
  schedule:
    # 한국 시간 기준 월~금(평일) 매일 저녁 18:30 자동 실행 (UTC 09:30)
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # 언제든 수동으로 [Run workflow] 버튼을 눌러 돌릴 수도 있음

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 갱신된 data.json 파일을 저장소에 자동 커밋하기 위한 쓰기 권한

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Tracker Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python updater.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update: $(date +'%Y-%m-%d %H:%M')" && git push)
