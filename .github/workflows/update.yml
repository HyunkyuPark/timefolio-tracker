name: Daily Auto ETF Position Tracker

on:
  schedule:
    # 한국 시간(KST) 매일 평일(월~금) 오후 5시 30분 자동 실행 (UTC 08:30)
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 원할 때 버튼 클릭으로 즉시 수동 실행도 가능

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 라이브러리 설치
        run: |
          pip install pandas requests

      - name: 파이썬 수집 및 판별 스크립트 실행
        run: |
          python updater.py

      - name: 새로 생성된 data.json 자동 커밋 & 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto Update: $(date +'%Y-%m-%d') ETF Data" || echo "변경 사항 없음"
          git push
